name: Build backend images

# Builds the production images and pushes them to GHCR as ghcr.io/<owner>/kaucjapp-<service>:<commit sha>.
# Every commit gets a complete set of images: services whose sources did not change are re-tagged from the
# previous ":main" image (seconds) instead of being rebuilt as GraalVM native images (minutes).
# The "Deploy" workflow runs after this one succeeds on main.

on:
  push:
    branches: [ "main", "kaucjap-three-dot-zero-prod-by-maxxx" ]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every image, ignoring change detection"
        type: boolean
        default: true

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which images need a rebuild
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
        run: |
          set -euo pipefail
          # service | maven module | Dockerfile (relative to backend/)
          services=(
            "auth-service|auth|Dockerfile.native"
            "users-service|users-service|Dockerfile.native"
            "offers-service|offers-service|Dockerfile.native"
            "deposit-service|deposit-service|Dockerfile.native"
            "notification-service|notification-service|Dockerfile.native"
            "gql-gateway|gql-gateway|Dockerfile.native"
            "monitor-service|monitor|monitor/Dockerfile"
          )

          rebuild_all=true
          changed=""
          # Only main has a trustworthy ":main" image to re-tag from; everything else is always built in full.
          if [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" && "$FORCE_ALL" != "true" \
                && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            rebuild_all=false
            if grep -Eq '^(backend/pom\.xml|backend/common/|backend/Dockerfile\.native|backend/mvnw|backend/\.mvn/|backend/\.dockerignore|\.github/workflows/backend-images\.yml)' <<<"$changed"; then
              rebuild_all=true
            fi
          fi

          entries=()
          for s in "${services[@]}"; do
            IFS='|' read -r service module dockerfile <<<"$s"
            build=true
            if [[ "$rebuild_all" == "false" ]] && ! grep -Eq "^backend/${module}/" <<<"$changed"; then
              build=false
            fi
            entries+=("$(jq -cn --arg service "$service" --arg module "$module" --arg dockerfile "$dockerfile" --argjson build "$build" \
              '{service:$service,module:$module,dockerfile:$dockerfile,build:$build}')")
          done
          matrix="$(printf '%s\n' "${entries[@]}" | jq -cs '{include: .}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  image:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kaucjapp-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag unchanged image
        id: retag
        if: ${{ !matrix.build }}
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.name.outputs.image }}:${GITHUB_SHA}" \
            "${{ steps.name.outputs.image }}:main"

      - name: Build and push
        if: ${{ matrix.build || steps.retag.outcome == 'failure' }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.dockerfile }}
          build-args: |
            SERVICE_NAME=${{ matrix.module }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', steps.name.outputs.image) || format('{0}:branch', steps.name.outputs.image) }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
