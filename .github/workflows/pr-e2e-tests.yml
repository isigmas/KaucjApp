name: PR Ephemeral Environment & Tests

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and run Unit Tests with Maven
        run: ./mvnw clean install -DskipTests=true # Ustawione testowo na true

  e2e-tests-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Docker Compose
        working-directory: ./backend
        run: |
          echo "DB_USER=test_user" >> .env
          echo "DB_PASSWORD=test_pass" >> .env
          echo "IT_SECRET=super_secret_it" >> .env
          echo "JWT_SECRET=super_secret_jwt" >> .env
          echo "PASSWORD_SALT=super_secret_salt" >> .env

      - name: Start Ephemeral Environment (Docker Compose)
        working-directory: ./backend
        run: docker-compose -f compose.yaml up -d --build

      - name: Wait for API Gateway to be ready
        run: |
          echo "Waiting for all services to become healthy..."
          # docker-compose up waits for depends_on, but let's make sure gateway is up
          timeout 120 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/)" != "200" && "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/)" != "404" ]]; do sleep 5; done' || echo "Timeout or gateway responded, continuing..."
          # Dajemy mu jeszcze 10 sekund na ustabilizowanie
          sleep 10
          docker ps

      - name: Setup Node.js (dla Newmana)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman (Postman CLI)
        run: npm install -g newman

      - name: Run E2E Tests on Local Runner
        run: |
          # Baza to localhost:8080
          newman run e2e-tests/postman_collection.json --env-var "baseUrl=http://localhost:8080"
          
      - name: Stop Ephemeral Environment
        if: always()
        working-directory: ./backend
        run: docker-compose -f compose.yaml down -v
