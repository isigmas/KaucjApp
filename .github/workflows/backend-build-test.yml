name: Docker Build and Test - backend

on:
  push:
    branches: [ "main", "backend", "kaucjap-three-dot-zero-prod-by-maxxx" ]
  pull_request:
    branches: [ "main", "backend" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Pull source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Run Spring Boot Tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TESTCONTAINERS_RYUK_DISABLED: true
        run: ./mvnw test

      - name: Cleanup after tests
        run: docker system prune -f

      - name: Build and launch containers
        env:
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PASSWORD_SALT: ${{ secrets.PASSWORD_SALT }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          IT_SECRET: ${{ secrets.IT_SECRET }}
        run: docker compose -f compose.yaml -f compose.cicd.yaml up --build -d --wait --wait-timeout 300

      - name: Seed a users-service profile for the bootstrap admin
        env:
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Accounts are activated by e-mail, so the profile is created the same way auth does: through users.sync.
          echo '{"user_id":1,"username":"smokeadmin","first_name":"Smoke","last_name":"Admin","phone":"123456789","email":"smoke-admin@example.com"}' \
            | docker compose -f compose.yaml -f compose.cicd.yaml exec -T kafka \
              /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic users.sync
          sleep 10

      - name: Smoke test through the gateway
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMOKE_UPLOAD: "1"
        run: ../deploy/scripts/smoke-test.sh http://localhost:8080

      - name: Print logs on failure
        if: failure()
        env:
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose -f compose.yaml -f compose.cicd.yaml logs

      - name: Tear down
        if: always()
        env:
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose -f compose.yaml -f compose.cicd.yaml down -v