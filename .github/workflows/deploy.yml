name: Deploy

# Deploys a set of images (identified by the commit sha they were built from) to the production VPS.
#   - automatically after "Build backend images" succeeds on main
#   - manually (workflow_dispatch) from any branch; used for the dry run of a branch and for redeploying/rolling back
#
# Secrets/variables come from the GitHub Environment "production" (see deploy/README.md).
# If the new version does not become healthy, or the external smoke test fails, the previous good version is restored.

on:
  workflow_run:
    workflows: ["Build backend images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit sha) to deploy. Empty = the sha this workflow runs on"
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      # secrets
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PASSWORD_SALT: ${{ secrets.PASSWORD_SALT }}
      IT_SECRET: ${{ secrets.IT_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      STORAGE_S3_ACCESS_KEY: ${{ secrets.STORAGE_S3_ACCESS_KEY }}
      STORAGE_S3_SECRET_KEY: ${{ secrets.STORAGE_S3_SECRET_KEY }}
      BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
      BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
      BACKUP_HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
      # variables
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      DB_USER: ${{ vars.DB_USER }}
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      STORAGE_S3_ENDPOINT: ${{ vars.STORAGE_S3_ENDPOINT }}
      STORAGE_S3_BUCKET: ${{ vars.STORAGE_S3_BUCKET }}
      STORAGE_S3_PUBLIC_BASE_URL: ${{ vars.STORAGE_S3_PUBLIC_BASE_URL }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
    steps:
      - name: Resolve what to deploy
        id: target
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="${INPUT_TAG:-${RUN_SHA:-$GITHUB_SHA}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag $tag"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Check configuration
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS API_DOMAIN ACME_EMAIL DB_USER DB_PASSWORD REDIS_PASSWORD \
                      JWT_SECRET PASSWORD_SALT IT_SECRET ADMIN_USERNAME ADMIN_EMAIL ADMIN_PASSWORD MAIL_PASSWORD \
                      STORAGE_S3_ENDPOINT STORAGE_S3_BUCKET STORAGE_S3_ACCESS_KEY STORAGE_S3_SECRET_KEY STORAGE_S3_PUBLIC_BASE_URL \
                      BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing in the 'production' environment: ${missing[*]}"
            exit 1
          fi

      - name: Generate .env
        run: |
          set -euo pipefail
          umask 077
          names=(API_DOMAIN ACME_EMAIL DB_USER DB_PASSWORD REDIS_PASSWORD JWT_SECRET PASSWORD_SALT IT_SECRET \
                 ADMIN_USERNAME ADMIN_EMAIL ADMIN_PASSWORD MAIL_PASSWORD \
                 STORAGE_S3_ENDPOINT STORAGE_S3_BUCKET STORAGE_S3_ACCESS_KEY STORAGE_S3_SECRET_KEY STORAGE_S3_PUBLIC_BASE_URL \
                 BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY BACKUP_HEALTHCHECK_URL)
          : > "$RUNNER_TEMP/deploy.env"
          for name in "${names[@]}"; do
            value="${!name:-}"
            # Docker Compose .env files interpolate "$", treat "#" as comments and strip quotes: reject such values early.
            if [[ "$value" =~ [[:space:]\$\#\'\"\\] ]]; then
              echo "::error::$name contains whitespace, \$, #, quotes or backslashes - use a generated alphanumeric value"
              exit 1
            fi
            printf '%s=%s\n' "$name" "$value" >> "$RUNNER_TEMP/deploy.env"
          done
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_REGISTRY=ghcr.io/%s/kaucjapp\n' "$owner" >> "$RUNNER_TEMP/deploy.env"
          printf 'IMAGE_TAG=%s\n' "${{ steps.target.outputs.tag }}" >> "$RUNNER_TEMP/deploy.env"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF

      - name: Upload deploy files
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.env' --exclude='.env.*' --exclude='.current-tag' --exclude='.last-good-tag' \
            deploy/ deploy-target:/opt/kaucjapp/
          scp -q "$RUNNER_TEMP/deploy.env" deploy-target:/opt/kaucjapp/.env.new
          ssh deploy-target 'chmod 600 /opt/kaucjapp/.env.new && mv /opt/kaucjapp/.env.new /opt/kaucjapp/.env && chmod +x /opt/kaucjapp/scripts/*.sh'
          rm -f "$RUNNER_TEMP/deploy.env"

      - name: Deploy
        id: deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh deploy-target "/opt/kaucjapp/scripts/deploy.sh deploy '${{ steps.target.outputs.tag }}'"

      - name: Smoke test
        id: smoke
        env:
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # DNS/TLS can take a moment right after the very first deployment
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 10 -o /dev/null "https://${API_DOMAIN}/api/gateway/status" && break
            echo "waiting for https://${API_DOMAIN} (attempt $i)"; sleep 10
          done
          bash deploy/scripts/smoke-test.sh "https://${API_DOMAIN}"

      - name: Mark as last known good
        run: ssh deploy-target "/opt/kaucjapp/scripts/deploy.sh mark-good"

      - name: Roll back after failed smoke test
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        run: ssh deploy-target "/opt/kaucjapp/scripts/deploy.sh rollback"

      - name: Log out of GHCR on the server
        if: ${{ always() }}
        continue-on-error: true
        run: ssh deploy-target "docker logout ghcr.io"
