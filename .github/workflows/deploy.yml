name: CI/CD Pipeline to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RG_NAME }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and run Unit Tests with Maven
        run: ./mvnw clean install -DskipTests=true # Ustawione testowo na true, docelowo zdejmij flage, żeby biegały pełne testy: clean test

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Docker Images
        working-directory: ./backend
        run: |
          docker-compose -f compose.yaml build
          
          docker tag backend-offers-service ${{ env.ACR_NAME }}.azurecr.io/offers-service:${{ env.IMAGE_TAG }}
          docker tag backend-users-service ${{ env.ACR_NAME }}.azurecr.io/users-service:${{ env.IMAGE_TAG }}
          docker tag backend-auth-service ${{ env.ACR_NAME }}.azurecr.io/auth-service:${{ env.IMAGE_TAG }}
          docker tag backend-api-gateway ${{ env.ACR_NAME }}.azurecr.io/api-gateway:${{ env.IMAGE_TAG }}
          
          docker push ${{ env.ACR_NAME }}.azurecr.io/offers-service:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/users-service:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/auth-service:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/api-gateway:${{ env.IMAGE_TAG }}

  deploy-to-azure:
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Infrastructure & Apps via Bicep
        uses: azure/arm-deploy@v1
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./backend/main.bicep
          parameters: >
            acrName=${{ env.ACR_NAME }}
            dbPassword=${{ secrets.DB_PASSWORD }}
            itSecret=${{ secrets.IT_SECRET }}
            jwtSecret=${{ secrets.JWT_SECRET }}
            passwordSalt=${{ secrets.PASSWORD_SALT }}
            imageTag=${{ env.IMAGE_TAG }}
          failOnStdErr: false

      - name: Fetch Gateway URL for Tests
        id: fetch_url
        run: |
          GATEWAY_URL=$(az containerapp show -n api-gateway -g ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "GATEWAY_URL=https://$GATEWAY_URL" >> $GITHUB_ENV
          echo "Api Gateway jest dostępne pod: https://$GATEWAY_URL"

      - name: Setup Node.js (dla Newmana)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman (Postman CLI)
        run: npm install -g newman

      - name: Run E2E Tests on Staging
        run: |
          # Zastępujemy testowy adres URL w Postmanie prawdziwym Gateway URL z Azure
          newman run e2e-tests/postman_collection.json --env-var "baseUrl=${{ env.GATEWAY_URL }}"
