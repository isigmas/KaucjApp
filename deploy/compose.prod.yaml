# Production stack for a single VPS (4 GB RAM recommended). Deployed by .github/workflows/deploy.yml.
# Only Caddy publishes ports (80/443). Everything else talks over the internal Docker network.
#
# Required variables are provided via deploy/.env (generated by CI from the GitHub Environment "production").
name: kaucjapp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-wget-check: &wget-check
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 40s

x-service-env: &service-env
  SERVER_PORT: "8080"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_DATASOURCE_USERNAME: ${DB_USER:?}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    logging: *logging
    depends_on:
      gql-gateway:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=60
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s
    mem_limit: 640m
    logging: *logging

  kafka-init:
    image: apache/kafka:4.1.2
    restart: "no"
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
      - ./kafka/topics.txt:/topics.txt:ro
    mem_limit: 256m
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 160m
    logging: *logging

  auth-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/isigmas/kaucjapp}-auth-service:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["-Xmx128m"]
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:?}
      IT_SECRET: ${IT_SECRET:?}
      PASSWORD_SALT: ${PASSWORD_SALT:?}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      SPRING_DATA_REDIS_DATABASE: "0"
    healthcheck:
      <<: *wget-check
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/auth/status"]
    mem_limit: 256m
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  users-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/isigmas/kaucjapp}-users-service:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["-Xmx128m"]
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      IT_SECRET: ${IT_SECRET:?}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?}
      STORAGE_S3_REGION: auto
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:?}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?}
      STORAGE_S3_PUBLIC_BASE_URL: ${STORAGE_S3_PUBLIC_BASE_URL:?}
    healthcheck:
      <<: *wget-check
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/user/test"]
    mem_limit: 256m
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  offers-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/isigmas/kaucjapp}-offers-service:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["-Xmx160m"]
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/offers_db
    healthcheck:
      <<: *wget-check
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/offer/test"]
    mem_limit: 288m
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  deposit-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/isigmas/kaucjapp}-deposit-service:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["-Xmx128m"]
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deposit_db
    healthcheck:
      <<: *wget-check
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/deposit/test"]
    mem_limit: 256m
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  notification-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/isigmas/kaucjapp}-notification-service:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["-Xmx128m"]
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      MAIL_PASSWORD: ${MAIL_PASSWORD:?}
      BASE_URL: https://${API_DOMAIN:?}
    healthcheck:
      <<: *wget-check
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/notification/status"]
    mem_limit: 256m
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  monitor-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/isigmas/kaucjapp}-monitor-service:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      KAFKA_SERVERS: kafka:9092
      MONITOR_DB_URL: jdbc:postgresql://postgres:5432/monitor_db
      MONITOR_DB_USERNAME: ${DB_USER:?}
      MONITOR_DB_PASSWORD: ${DB_PASSWORD:?}
      MONITOR_DB_POOL_SIZE: "3"
    healthcheck:
      <<: *wget-check
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/monitor/status"]
    mem_limit: 448m
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  gql-gateway:
    image: ${IMAGE_REGISTRY:-ghcr.io/isigmas/kaucjapp}-gql-gateway:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["-Xmx128m"]
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      SPRING_DATA_REDIS_DATABASE: "1"
    healthcheck:
      <<: *wget-check
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/gateway/status"]
    mem_limit: 256m
    logging: *logging
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      users-service: {condition: service_healthy}
      offers-service: {condition: service_healthy}
      deposit-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      monitor-service: {condition: service_healthy}

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  caddy_data:
  caddy_config:
