#cloud-config
# Paste into the "user data" / "cloud-init" field when ordering the VPS (OVH, Hetzner, Contabo, ... all support it).
# Before pasting, replace:
#   <DEPLOY_PUBLIC_KEY>  with the PUBLIC key of the SSH key pair GitHub Actions will use (see deploy/README.md)
#   <REPO_REF>           with the git ref to take bootstrap.sh from (e.g. main)
#
# It only downloads and runs deploy/scripts/bootstrap.sh, which does all the hardening and setup.
package_update: true
packages:
  - curl
write_files:
  - path: /root/bootstrap.env
    permissions: "0600"
    content: |
      DEPLOY_SSH_PUBLIC_KEY="<DEPLOY_PUBLIC_KEY>"
runcmd:
  - |
    set -e
    curl -fsSL "https://raw.githubusercontent.com/isigmas/KaucjApp/<REPO_REF>/deploy/scripts/bootstrap.sh" -o /root/bootstrap.sh
    set -a; . /root/bootstrap.env; set +a
    bash /root/bootstrap.sh > /var/log/kaucjapp-bootstrap.log 2>&1
    rm -f /root/bootstrap.env
