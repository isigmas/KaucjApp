<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">

<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

    <h1 style="color: #333333; text-align: center;" th:text="'Witaj, ' + ${name} + '!'">Zresetuj swoje hasło KaucjApp</h1>

    <p style="color: #555555; line-height: 1.6; font-size: 13px; text-align: center">
        Wierzymy, że poprosiłeś o reset hasła KaucjApp. Jeśli tak, po prostu wciśnij klawisz poniżej, a on otworzy bezpieczną stronę internetową, gdzie możesz wprowadzić nowe hasło.
    </p>

    <div style="text-align: center; margin-top: 30px;">
        <a th:href="@{|${baseUrl}/api/notification/account/resetpassword?token=${token}|}"
           style="background-color: #087313; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Resetuj hasło
        </a>
    </div>

    <hr style="border: none; border-top: 1px solid #eeeeee; margin-top: 40px; margin-bottom: 20px;">
    <p style="color: #999999; font-size: 12px; text-align: center;">
        (Jeśli nie prosiłeś o reset hasła, możesz zignorować tą wiadomość.)
    </p>
</div>

</body>
</html>
