server.port=8084
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.jpa.hibernate.ddl-auto=update

spring.mail.host=smtp.resend.com
spring.mail.port=587

spring.mail.username=resend
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.starttls.required=true
spring.mail.default-encoding=UTF-8

app.mail.from=KaucjApp <noreply@kaucjapp.pl>

app.base-url=${BASE_URL}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.isigmas.kaucjapp.*
spring.kafka.consumer.properties.spring.json.value.default.type=pl.isigmas.kaucjapp.notification.dto.MailRequest