server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db

app.admin.default-username=${ADMIN_USERNAME}
app.admin.default-email=${ADMIN_EMAIL}
app.admin.default-password=${ADMIN_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=pl.isigmas.kaucjapp.auth.config.CustomKafkaJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

validation.profanity.words=kutas,chuj,huj,kurw,jeb,cip,cwel,debil,pierdol,pizd,dziwk,szmat,suka,pedal,zjeb,rucha,srac,zajeb,nigger,niger,nigga,fuck,ass,dick,cock,pussy
validation.profanity.reserved=admin,administrator,support,moderator,mod,system,root,pomoc,kaucjapp,test,bot,guest,superuser