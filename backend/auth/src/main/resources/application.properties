server.port=${SERVER_PORT:8083}
spring.main.cloud-platform=none
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

app.admin.default-username=${ADMIN_USERNAME}
app.admin.default-email=${ADMIN_EMAIL}
app.admin.default-password=${ADMIN_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=pl.isigmas.kaucjapp.auth.config.CustomKafkaJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=auth-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

validation.profanity.words=kutas,chuj,huj,kurw,jeb,cip,cwel,debil,pierdol,pizd,dziwk,szmat,suka,pedal,zjeb,rucha,srac,zajeb,nigger,niger,nigga,fuck,ass,dick,cock,pussy
validation.profanity.reserved=admin,administrator,support,moderator,mod,system,root,pomoc,kaucjapp,test,bot,guest,superuser