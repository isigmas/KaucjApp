# Test configuration - loaded when @ActiveProfiles("test") is used
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Feign discovery
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# Password salt for tests
PASSWORD_SALT=test-secret-salt

# User service URL (will be mocked by WireMock)
USER_SERVICE_URL=http://localhost:8089

# Secret forwarded to users-service in X-Internal-Secret header
IT_SECRET=test-it-secret

# Notification service URL (will be mocked by WireMock)
NOTIFICATION_SERVICE_URL=http://localhost:8090

# JPA settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable cloud features that might interfere
spring.cloud.discovery.enabled=false

# JWT Secret for tests
jwt.secret=DeveloperSecretKeyForJWT123455789!

# Admin account default values for tests
app.admin.default-username=admin
app.admin.default-email=admin@example.com
app.admin.default-password=admin
app.admin.jwt-secret=DeveloperSecretKeyForJWT123455789!

validation.profanity.words=kutas,chuj,huj,kurw,jeb,cip,cwel,debil,pierdol,pizd,dziwk,szmat,suka,pedal,zjeb,rucha,srac,zajeb,nigger,niger,nigga,fuck,ass,dick,cock,pussy
validation.profanity.reserved=admin,administrator,support,moderator,mod,system,root,pomoc,kaucjapp,test,bot,guest,superuser