# Test configuration - loaded when @ActiveProfiles("test") is used
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Feign discovery
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# Password salt for tests
PASSWORD_SALT=test-secret-salt

# User service URL (will be mocked by WireMock)
USER_SERVICE_URL=http://localhost:8089

# JPA settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable cloud features that might interfere
spring.cloud.discovery.enabled=false
