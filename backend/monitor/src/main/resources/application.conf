app {
  server {
    host = ${SERVER_HOST}
    port = ${SERVER_PORT}
  }

  kafka {
    bootstrap-servers = ${KAFKA_SERVERS}
    topic = "system-logs"
    group-id = "event-monitor"
    security-protocol = ${?KAFKA_SECURITY_PROTOCOL}
    sasl-mechanism = ${?KAFKA_SASL_MECHANISM}
    sasl-jaas-config = ${?KAFKA_SASL_JAAS_CONFIG}
  }
}

pekko {
  loglevel = "INFO"
}

ctx {
  keyspace = "monitor_db"
  preparedStatementCacheSize = 1000
  session {
    basic.contact-points = [ ${CASSANDRA_CONTACT_POINTS} ]
    basic.load-balancing-policy.local-datacenter = ${CASSANDRA_DATACENTER}
    basic.session-keyspace = ${ctx.keyspace}
    advanced.ssl-engine-factory.class = ${?CASSANDRA_SSL_ENGINE_FACTORY_CLASS}
    advanced.auth-provider.class = ${?CASSANDRA_AUTH_PROVIDER_CLASS}
    advanced.auth-provider.username = ${?CASSANDRA_USERNAME}
    advanced.auth-provider.password = ${?CASSANDRA_PASSWORD}
  }
}