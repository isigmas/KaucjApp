services:
  users-service:
    environment:
      AZURE_STORAGE_USE_DEVELOPMENT_STORAGE: "true"
      AZURE_STORAGE_DEVELOPMENT_STORAGE_PROXY_URI: "http://azurite:10000"
      AZURE_STORAGE_CONTAINER_NAME: profile-pictures
      AZURE_STORAGE_PUBLIC_BLOB_ENDPOINT: "http://127.0.0.1:10000/devstoreaccount1"
      AZURE_STORAGE_PUBLIC_READ_ACCESS: "true"
    depends_on:
      azurite:
        condition: service_started

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: kaucjapp-azurite
    ports:
      - "10000:10000"
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose --skipApiVersionCheck
    volumes:
      - azurite_data:/data

volumes:
  azurite_data:
