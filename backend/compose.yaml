services:
  postgres:
    build:
      context: .
      dockerfile: services/Dockerfile.db
    environment:
      - POSTGRES_DB=kaucjappdb
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d kaucjappdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  services:
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/kaucjappdb
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - '8080:8080'
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_ROUTES_0_ID=services
      - GATEWAY_ROUTES_0_URI=http://services:8080
      - GATEWAY_ROUTES_0_PATH=/api/**
    depends_on:
      services:
        condition: service_healthy