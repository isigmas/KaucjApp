services:
  offers-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: offers_db
    ports:
      - "5432:5432"
    volumes:
      - ./offers-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  offers-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: offers-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://offers-db:5432/offers_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      offers-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/api/offer/test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  users-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - ./users-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  users-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: users-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://users-db:5432/users_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/user/test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - '8080:8080'
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_ROUTES_0_ID=users
      - GATEWAY_ROUTES_0_URI=http://users-service:8081
      - GATEWAY_ROUTES_0_PATH=/api/user/**
      - GATEWAY_ROUTES_1_ID=offers
      - GATEWAY_ROUTES_1_URI=http://offers-service:8082
      - GATEWAY_ROUTES_1_PATH=/api/offer/**
    depends_on:
      offers-service:
        condition: service_healthy
      users-service:
        condition: service_healthy