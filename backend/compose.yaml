# Dev / CI environment. Same topology as production (deploy/compose.prod.yaml):
# one Postgres with a database per service, one Kafka, one Redis, an S3-compatible store for profile pictures.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.2
    restart: "no"
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    volumes:
      - ../deploy/kafka/create-topics.sh:/create-topics.sh:ro
      - ../deploy/kafka/topics.txt:/topics.txt:ro
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devredis}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store for profile pictures (Cloudflare R2 in production).
  storage:
    image: adobe/s3mock:5.2.3
    ports:
      - "9090:9090"
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=profile-pictures
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  offers-service:
    build:
      context: .
      dockerfile: offers-service/Dockerfile
      args:
        SERVICE_NAME: offers-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/offers_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/offer/test"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
      args:
        SERVICE_NAME: users-service
    environment:
      - IT_SECRET=${IT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/users_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - STORAGE_S3_ENDPOINT=http://storage:9090
      # Must be reachable from the phone/emulator; override in .env when testing on a physical device (LAN IP).
      - STORAGE_S3_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9090}
      - STORAGE_S3_PUBLIC_BASE_URL=${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9090}/profile-pictures
      - STORAGE_S3_BUCKET=profile-pictures
      - STORAGE_S3_ACCESS_KEY=dev
      - STORAGE_S3_SECRET_KEY=dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/user/test"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: auth/Dockerfile
      args:
        SERVICE_NAME: auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - IT_SECRET=${IT_SECRET}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - JWT_SECRET=${JWT_SECRET}
      - PASSWORD_SALT=${PASSWORD_SALT}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-devredis}
      - SPRING_DATA_REDIS_DATABASE=0
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/auth/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  deposit-service:
    build:
      context: .
      dockerfile: deposit-service/Dockerfile
      args:
        SERVICE_NAME: deposit-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/deposit_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/deposit/test"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - BASE_URL=http://localhost:8080
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/notification/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  monitor-service:
    build:
      context: .
      dockerfile: monitor/Dockerfile
      args:
        SERVICE_NAME: monitor-service
    environment:
      - KAFKA_SERVERS=kafka:9092
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - MONITOR_DB_URL=jdbc:postgresql://postgres:5432/monitor_db
      - MONITOR_DB_USERNAME=${DB_USER}
      - MONITOR_DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/monitor/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gql-gateway:
    build:
      context: .
      dockerfile: gql-gateway/Dockerfile
      args:
        SERVICE_NAME: gql-gateway
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-devredis}
      - SPRING_DATA_REDIS_DATABASE=1
    depends_on:
      offers-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      deposit-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      monitor-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/gateway/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gql-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
