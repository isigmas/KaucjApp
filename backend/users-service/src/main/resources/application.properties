server.port=${SERVER_PORT:8081}
spring.main.cloud-platform=none
spring.application.name=users-service
spring.datasource.url=jdbc:postgresql://localhost:5432/users_db
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=users-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.isigmas.kaucjapp.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false


# Profile pictures: S3-compatible storage (Cloudflare R2 in prod, MinIO in dev)
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
storage.s3.public-endpoint=${STORAGE_S3_PUBLIC_ENDPOINT:}
storage.s3.region=${STORAGE_S3_REGION:auto}
storage.s3.bucket=${STORAGE_S3_BUCKET:profile-pictures}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:minioadmin}
storage.s3.public-base-url=${STORAGE_S3_PUBLIC_BASE_URL:http://localhost:9000/profile-pictures}
storage.s3.max-file-size-bytes=5242880
