server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/users_db
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Azure Blob / Azurite (profile pictures) ---
# Local: start Azurite on port 10000.
azure.storage.use-development-storage=${AZURE_STORAGE_USE_DEVELOPMENT_STORAGE:false}
azure.storage.development-storage-proxy-uri=${AZURE_STORAGE_DEVELOPMENT_STORAGE_PROXY_URI:http://127.0.0.1:10000}
azure.storage.blob-endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:devstoreaccount1}
azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:profile-pictures}
# URL reachable from mobile/simulator (NOT the Docker hostname "azurite")
azure.storage.public-blob-endpoint=${AZURE_STORAGE_PUBLIC_BLOB_ENDPOINT:http://127.0.0.1:10000/devstoreaccount1}
azure.storage.public-read-access=${AZURE_STORAGE_PUBLIC_READ_ACCESS:true}
azure.storage.max-file-size-bytes=5242880

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=users-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.isigmas.kaucjapp.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
